# 每日自动构建：Android 插件 APK ＋ Linux 桌面便携包，发布到 nightly 预发布。
# 无新提交时跳过（手动触发总是构建）。
name: nightly

on:
  schedule:
    - cron: "0 18 * * *"        # 每天 UTC 18:00（北京时间 02:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.c.outputs.build }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" \
                   --jq .object.sha 2>/dev/null || true)
          if [[ "${{ github.event_name }}" == workflow_dispatch || "$last" != "${{ github.sha }}" ]]; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo "nightly 已是 ${{ github.sha }}，跳过"; echo build=false >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04          # fcitx5 5.1.7：老头文件编译，向后兼容新发行版
    steps:
      - uses: actions/checkout@v4
      - name: 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake g++ make patchelf extra-cmake-modules \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
            fcitx5-modules-dev fcitx5-module-punctuation-dev \
            libimecore-dev libimepinyin-dev libboost-dev libboost-iostreams-dev \
            fcitx5-module-punctuation fcitx5-module-chttrans \
            libime-data libime-data-language-model
      - name: 构建便携包
        run: packaging/linux/build-tarball.sh nightly
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*.tar.gz

  android:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      LANGYA_ABI: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: 依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq extra-cmake-modules gettext
      - uses: actions/cache@v4
        with:
          path: android/build/gradle-home
          key: gradle-${{ hashFiles('android/plugin/build.gradle.kts', 'android/xmake.lua') }}
          restore-keys: gradle-
      - name: 签名密钥
        # 与 jiyi 一致：用 CI 现场生成的调试密钥签名（插件加载不校验签名）。
        # 每次构建签名不同，跨版本升级需先卸载旧插件；如需原地升级，
        # 配置 secrets ANDROID_KEYSTORE_BASE64/_PASSWORD/ANDROID_KEY_ALIAS 即自动改用。
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -n "$KS_B64" ]]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            { echo "SIGN_KEY_FILE=$RUNNER_TEMP/release.keystore"
              echo "SIGN_KEY_PWD=$KS_PWD"
              echo "SIGN_KEY_ALIAS=$KS_ALIAS"; } >> "$GITHUB_ENV"
          elif [[ ! -f ~/.android/debug.keystore ]]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: 构建插件 APK
        run: |
          xmake setup-android
          xmake sync-android
          xmake build-android | tee build.log
          apk=$(sed -n 's/^APK：//p' build.log | tail -1)
          mkdir -p dist && cp "$apk" "dist/langya-nightly-android-${LANGYA_ABI}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布 nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=${{ github.sha }}
          cat > notes.md <<EOF
          每日自动构建（\`${sha:0:7}\`，$(date -u +%Y-%m-%d)）。未经人工测试；APK 每次签名不同，升级前请先卸载旧版插件。

          | 文件 | 平台 | 安装 |
          |---|---|---|
          | \`langya-nightly-android-arm64-v8a.apk\` | Android（fcitx5-android 0.1.3 插件） | 装好宿主 App 后安装 APK，插件管理中启用「琅琊小篆」 |
          | \`langya-nightly-linux-x86_64.tar.gz\` | Linux（fcitx5 5.1+） | 解压后运行 \`./install.sh\`（装到 ~/.local，无需 root），重新登录后添加「琅琊小篆」 |

          显示小篆需安装[说文小篆字体](https://github.com/xiaoshihou514/xiaozhuan_unicode_fonts/releases/latest)。
          EOF
          gh release delete nightly -R "$REPO" --cleanup-tag -y || true
          gh release create nightly -R "$REPO" --target "$sha" --prerelease \
            --title "nightly (${sha:0:7})" --notes-file notes.md dist/*
